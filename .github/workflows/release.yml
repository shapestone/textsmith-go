name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./pkg/text

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since previous tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -i "^- feat" || echo "")
          FIXES=$(echo "$COMMITS" | grep -i "^- fix" || echo "")
          DOCS=$(echo "$COMMITS" | grep -i "^- docs\|^- doc:" || echo "")
          TESTS=$(echo "$COMMITS" | grep -i "^- test" || echo "")
          REFACTOR=$(echo "$COMMITS" | grep -i "^- refactor" || echo "")
          CHORE=$(echo "$COMMITS" | grep -i "^- chore" || echo "")
          OTHER=$(echo "$COMMITS" | grep -vi "^- feat\|^- fix\|^- docs\|^- doc:\|^- test\|^- refactor\|^- chore" || echo "")

          # Build changelog
          CHANGELOG="## What's Changed"$'\n\n'

          if [ ! -z "$FEATURES" ]; then
            CHANGELOG+="### ✨ Features"$'\n'"$FEATURES"$'\n\n'
          fi

          if [ ! -z "$FIXES" ]; then
            CHANGELOG+="### 🐛 Bug Fixes"$'\n'"$FIXES"$'\n\n'
          fi

          if [ ! -z "$DOCS" ]; then
            CHANGELOG+="### 📚 Documentation"$'\n'"$DOCS"$'\n\n'
          fi

          if [ ! -z "$TESTS" ]; then
            CHANGELOG+="### 🧪 Tests"$'\n'"$TESTS"$'\n\n'
          fi

          if [ ! -z "$REFACTOR" ]; then
            CHANGELOG+="### ♻️ Refactoring"$'\n'"$REFACTOR"$'\n\n'
          fi

          if [ ! -z "$OTHER" ]; then
            CHANGELOG+="### Other Changes"$'\n'"$OTHER"$'\n\n'
          fi

          # Save to file and output
          echo "$CHANGELOG" > /tmp/changelog.md
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            # ${{ steps.get_version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ```bash
            go get github.com/shapestone/textsmith@${{ steps.get_version.outputs.VERSION }}
            ```

            ## Full Changelog

            See [CHANGELOG.md](https://github.com/shapestone/textsmith-go/blob/${{ steps.get_version.outputs.VERSION }}/CHANGELOG.md) for complete details.
          draft: false
          prerelease: false

  notify:
    name: Post-release Notifications
    needs: release
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Release successful
        run: |
          echo "✅ Release ${{ github.ref_name }} published successfully!"
          echo "📦 Users can now install via: go get github.com/shapestone/textsmith@${{ github.ref_name }}"